<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate STL Model AR</title>
    <!-- A-Frame と AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- ★ STLローダープラグインの追加 -->
    <script src="https://rawgit.com/donmccurdy/aframe-extras/v6.0.0/dist/aframe-extras.loaders.min.js"></script>

    <!-- タッチ回転スクリプト（クォータニオン版） -->
    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousPosition = { x: 0, y: 0 };

          const startDrag = (x, y) => {
            isDragging = true;
            previousPosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousPosition.x;
            var deltaY = y - previousPosition.y;

            var object3D = el.object3D;
            var sensitivity = 0.005;

            var deltaRotationQuaternion = new THREE.Quaternion()
              .setFromEuler(new THREE.Euler(
                deltaY * sensitivity,
                deltaX * sensitivity,
                0,
                'XYZ'
              ));

            object3D.quaternion.multiplyQuaternions(deltaRotationQuaternion, object3D.quaternion);

            previousPosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
          };

          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <!-- 
          ★ パスの確認: 
          index.htmlと同じフォルダに置く場合は src="apple.stl"
          ARフォルダ内にある場合は src="AR/apple.stl"（大文字小文字に注意）
        -->
        <a-asset-item id="stl-model" src="Apple.stl"></a-asset-item>
      </a-assets>

      <a-entity camera look-controls="enabled: false">
        
        <!-- 
          ★ stl-model コンポーネントで呼び出し 
          ※ STLは色情報を持たないことが多いため material="color: red" などで色を指定します
        -->
        <a-entity 
          stl-model="src: #stl-model"
          material="color: #e62200; roughness: 0.5;"
          drag-rotate
          position="0 0 -0.8" 
          scale="0.01 0.01 0.01">
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
