<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate GLTF Model AR</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- タッチ回転スクリプト（クォータニオン版） -->
    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousPosition = { x: 0, y: 0 };

          const startDrag = (x, y) => {
            isDragging = true;
            previousPosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousPosition.x;
            var deltaY = y - previousPosition.y;

            var object3D = el.object3D;
            var sensitivity = 0.005;

            var deltaRotationQuaternion = new THREE.Quaternion()
              .setFromEuler(new THREE.Euler(
                deltaY * sensitivity,
                deltaX * sensitivity,
                0,
                'XYZ'
              ));

            object3D.quaternion.multiplyQuaternions(deltaRotationQuaternion, object3D.quaternion);

            previousPosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
          };

          // マウスイベント
          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          // タッチイベント
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- 1. 3Dモデルアセットのアセット管理 -->
      <a-assets>
        <!-- 
          src に3Dモデルのパスを指定します。
          例: "models/apple.glb" や "./apple.glb" 
        -->
        <a-asset-item id="my-model" src="path/to/apple.glb"></a-asset-item>
      </a-assets>

      <a-entity camera look-controls="enabled: false">
        
        <!-- 2. GLTFモデルを表示して回転機能を適用 -->
        <a-gltf-model 
          src="#my-model"
          drag-rotate
          position="0 0 -0.8" 
          scale="0.1 0.1 0.1">
        </a-gltf-model>

      </a-entity>

    </a-scene>
  </body>
</html>
