<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate AR (Fix & Debug)</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- デバッグ画面のスタイル -->
    <style>
      #debug-panel {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #00ff00;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        border-radius: 5px;
        z-index: 9999;
        pointer-events: none;
      }
    </style>

    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousMousePosition = { x: 0, y: 0 };

          // デバッグ表示用の関数
          const updateDebugInfo = (deltaX, deltaY, rotX, rotY) => {
            const debugEl = document.getElementById('debug-info');
            if (debugEl) {
              debugEl.innerHTML = `
                [Dragging]: ${isDragging}<br>
                [Delta Y (Raw)]: ${deltaY.toFixed(2)}<br>
                [Rotation X]: ${rotX.toFixed(2)}deg<br>
                [Rotation Y]: ${rotY.toFixed(2)}deg
              `;
            }
          };

          const startDrag = (x, y) => {
            isDragging = true;
            previousMousePosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousMousePosition.x;
            var deltaY = y - previousMousePosition.y;

            var rotation = el.getAttribute('rotation');

            /* 
              【回転方向の設定】
              `+ deltaY` に変更しました。
              ・指を「上」へ動かす（Y減少） → X回転が減る
              ・指を「下」へ動かす（Y増加） → X回転が増える
            */
            var newRotX = rotation.x + deltaY * 0.5;
            var newRotY = rotation.y + deltaX * 0.5;

            el.setAttribute('rotation', {
              x: newRotX,
              y: newRotY,
              z: rotation.z
            });

            // デバッグログを更新
            updateDebugInfo(deltaX, deltaY, newRotX, newRotY);

            previousMousePosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
            var rotation = el.getAttribute('rotation');
            updateDebugInfo(0, 0, rotation.x, rotation.y);
          };

          // マウスイベント
          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          // タッチイベント
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- デバッグ用画面表示 -->
    <div id="debug-panel">
      <b>AR Rotate Debug</b><br>
      <div id="debug-info">操作待機中...</div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity camera look-controls="enabled: false">
        <a-box 
          drag-rotate
          position="0 0 -0.8" 
          scale="0.15 0.15 0.15" 
          material="color: red; opacity: 0.9;">
        </a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
