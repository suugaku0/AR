<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate STL AR</title>
    <!-- A-Frame と AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Three.js 用 STLローダー (安定したCDN) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/STLLoader.js"></script>

    <script>
      // STLファイルを読み込むカスタムコンポーネント
      AFRAME.registerComponent('stl-model-loader', {
        schema: {
          src: { type: 'string' },
          color: { type: 'color', default: '#ff0000' }
        },
        init: function () {
          const el = this.el;
          const data = this.data;
          const loader = new THREE.STLLoader();

          loader.load(
            data.src,
            function (geometry) {
              // メッシュの作成
              const material = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.4, 
                metalness: 0.2 
              });
              const mesh = new THREE.Mesh(geometry, material);

              // 3Dモデルの中心（原点）を中心位置に自動調整
              geometry.center();

              // A-Frame要素にセット
              el.setObject3D('mesh', mesh);
            },
            undefined,
            function (error) {
              console.error('STL読み込みエラー:', error);
            }
          );
        }
      });

      // クォータニオンによるタッチ回転コンポーネント
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousPosition = { x: 0, y: 0 };

          const startDrag = (x, y) => {
            isDragging = true;
            previousPosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousPosition.x;
            var deltaY = y - previousPosition.y;

            var object3D = el.object3D;
            var sensitivity = 0.005;

            var deltaRotationQuaternion = new THREE.Quaternion()
              .setFromEuler(new THREE.Euler(
                deltaY * sensitivity,
                deltaX * sensitivity,
                0,
                'XYZ'
              ));

            object3D.quaternion.multiplyQuaternions(deltaRotationQuaternion, object3D.quaternion);

            previousPosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
          };

          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- ライティングを追加（STLモデルを綺麗に見せるため） -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>

      <a-entity camera look-controls="enabled: false">
        
        <!-- 
          stl-model-loader: src に STLファイルのパスを指定
          scale: 表示されない場合は 0.001 や 0.1、1 など変更してみてください
        -->
        <a-entity 
          stl-model-loader="src: apple_model.stl; color: #e62200;"
          drag-rotate
          position="0 0 -0.8" 
          scale="0.005 0.005 0.005">
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
