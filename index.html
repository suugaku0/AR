<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate Apple AR</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- タッチ回転スクリプト（クォータニオン版） -->
    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousPosition = { x: 0, y: 0 };

          const startDrag = (x, y) => {
            isDragging = true;
            previousPosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousPosition.x;
            var deltaY = y - previousPosition.y;

            var object3D = el.object3D;
            var sensitivity = 0.005;

            var deltaRotationQuaternion = new THREE.Quaternion()
              .setFromEuler(new THREE.Euler(
                deltaY * sensitivity,
                deltaX * sensitivity,
                0,
                'XYZ'
              ));

            object3D.quaternion.multiplyQuaternions(deltaRotationQuaternion, object3D.quaternion);

            previousPosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
          };

          // マウスイベント
          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          // タッチイベント
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity camera look-controls="enabled: false">
        
        <!-- リンゴ全体のグループ（drag-rotateをまとめて適用） -->
        <a-entity drag-rotate position="0 0 -0.8">
          
          <!-- リンゴの実（少し横長に潰した赤い球体） -->
          <a-sphere 
            position="0 0 0" 
            radius="0.1" 
            scale="1.1 0.95 1.1" 
            material="color: #e62200; roughness: 0.3; metalness: 0.1;">
          </a-sphere>

          <!-- 茎（茶色の細い円柱） -->
          <a-cylinder 
            position="0 0.095 0" 
            radius="0.005" 
            height="0.04" 
            material="color: #5c3a21;">
          </a-cylinder>

          <!-- 葉っぱ（斜めに傾けた緑の円柱/楕円風） -->
          <a-cylinder 
            position="0.02 0.1 0" 
            rotation="30 0 -45" 
            scale="1 0.2 2" 
            radius="0.015" 
            height="0.005" 
            material="color: #38a800;">
          </a-cylinder>

        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
