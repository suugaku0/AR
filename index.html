<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate AR (Fix Inverted Y)</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- 指で回転させるスクリプト（上下反転修正版） -->
    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousMousePosition = { x: 0, y: 0 };

          // タッチ開始 / マウスダウン
          const startDrag = (x, y) => {
            isDragging = true;
            previousMousePosition = { x: x, y: y };
          };

          // タッチ移動 / マウス移動
          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousMousePosition.x;
            var deltaY = y - previousMousePosition.y;

            // 現在の回転度数を取得
            var rotation = el.getAttribute('rotation');

            // ドラッグ量に応じて回転
            // X軸（上下の傾き）の回転方向を「- deltaY」に修正
            el.setAttribute('rotation', {
              x: rotation.x - deltaY * 0.5,
              y: rotation.y + deltaX * 0.5,
              z: rotation.z
            });

            previousMousePosition = { x: x, y: y };
          };

          // タッチ終了 / マウスアップ
          const endDrag = () => {
            isDragging = false;
          };

          // マウスイベント
          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          // タッチイベント（スマホ対応）
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- カメラ -->
      <a-entity camera look-controls="enabled: false">
        <a-box 
          drag-rotate
          position="0 0 -0.8" 
          scale="0.15 0.15 0.15" 
          material="color: red; opacity: 0.9;">
        </a-box>
      </a-entity>

    </a-scene>
  </body>
</html>
