<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Touch Rotate AR (Quaternion Fix)</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          var el = this.el;
          var isDragging = false;
          var previousPosition = { x: 0, y: 0 };

          const startDrag = (x, y) => {
            isDragging = true;
            previousPosition = { x: x, y: y };
          };

          const moveDrag = (x, y) => {
            if (!isDragging) return;

            var deltaX = x - previousPosition.x;
            var deltaY = y - previousPosition.y;

            // Three.js のオブジェクト(3Dモデル)を取得
            var object3D = el.object3D;

            // 回転速度の感度調整
            var sensitivity = 0.005;

            // 画面のドラッグ方向に基づいた回転軸ベクトルを作成
            // - deltaY（縦スワイプ）はワールドX軸周りの回転
            // - deltaX（横スワイプ）はワールドY軸周りの回転
            var deltaRotationQuaternion = new THREE.Quaternion()
              .setFromEuler(new THREE.Euler(
                deltaY * sensitivity,  // 上下スワイプでX軸回転（上下回転）
                deltaX * sensitivity,  // 左右スワイプでY軸回転（左右回転）
                0,
                'XYZ'
              ));

            // 現在のクォータニオン（姿勢）に合成して更新
            object3D.quaternion.multiplyQuaternions(deltaRotationQuaternion, object3D.quaternion);

            previousPosition = { x: x, y: y };
          };

          const endDrag = () => {
            isDragging = false;
          };

          // マウスイベント
          window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
          window.addEventListener('mouseup', endDrag);

          // タッチイベント
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
              moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
          });
          window.addEventListener('touchend', endDrag);
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity camera look-controls="enabled: false">
        <a-box 
          drag-rotate
          position="0 0 -0.8" 
          scale="0.15 0.15 0.15" 
          material="color: red; opacity: 0.9;">
        </a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
